# ---------------------------------------------------------------------------
# Site configuration — debojit10.github.io
#
# Built and served by GitHub Pages' own Jekyll. There is deliberately no
# node/gulp/Sass toolchain: templates are Liquid, styles are hand-written CSS
# with custom properties, and behaviour is one dependency-free JS file. Edit
# content in _data/*.yml and push; GitHub Pages rebuilds on its own.
# ---------------------------------------------------------------------------

