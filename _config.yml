# --- Build ------------------------------------------------------------------
markdown: kramdown
encoding: utf-8
timezone: Asia/Kolkata
future: true

# No plugins. Everything GitHub Pages would give us via jekyll-seo-tag and
# jekyll-sitemap is hand-written in _includes/head.html and sitemap.xml, which
# keeps the build identical locally and on Pages.
plugins: []

# GitHub Pages force-enables jekyll-readme-index and
# jekyll-optional-front-matter, which would turn assets/fonts/README.md into
# that directory's index page. It is developer notes, so it stays out.
exclude:
  - assets/fonts/README.md
  - Gemfile
  - tools
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - .github
  - .editorconfig

keep_files:
  - .git
  - CNAME
